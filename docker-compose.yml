version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: compta_postgres
    environment:
      POSTGRES_DB: compta_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: SS2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: compta_api
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=compta_manager
      - DB_USER=postgres
      - DB_PASSWORD=SS2026
      - DB_TYPE=postgresql
      - FLASK_ENV=development
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: